{% extends "app/base/base.html" %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'app/css/formulario/styles.css' %}">
{% endblock %}
{% block contenido %}
<div class="container" style="padding: 110px 0">
    <h1 class="text-center">Postulación para Mecánico en Taller Rayo McQueen</h1>
    
    <form id= "formulario" action="{% url 'añadirpostulante' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="rut">RUT</label>
            <input type="text" class="form-control" id="rut" name="rut" required minlength="9" maxlength="10">
        </div>
        <div class="form-group">
            <label for="pnombre">Nombre</label>
            <input type="text" class="form-control" id="pnombre" name="pnombre" required minlength="3" maxlength="50">
        </div>
        <div class="form-group">
            <label for="appaterno">Apellido Paterno</label>
            <input type="text" class="form-control" id="appaterno" name="appaterno" required minlength="3" maxlength="50">
        </div>
        <div class="form-group">
            <label for="apmaterno">Apellido Materno</label>
            <input type="text" class="form-control" id="apmaterno" name="apmaterno" required minlength="3" maxlength="50">
        </div>
        <div class="form-group">
            <label for="fecha_nacimiento">Fecha de Nacimiento</label>
            <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
        </div>
        <div class="form-group">
            <label for="edad">Edad</label>
            <input type="number" class="form-control" id="edad" name="edad" required min="18">
        </div>
        <div class="form-group">
            <label for="tipo_genero"> Género</label>
            <select class="form-control" id="tipo_genero" name="tipo_genero" required>
                <option value="0">Seleccione</option>
                <option value="1">Femenino</option>
                <option value="2">Masculino</option>
                <option value="3">39 tipos de gay</option>
            </select>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="celular">Celular</label><br><br>
            <input type="number" class="form-control" id="celular" name="celular" required minlength="9" maxlength="12">
        </div>
        <div class="form-group">
            <label for="especializacion">Especialización</label>
            <input type="text" class="form-control" id="especializacion" name="especializacion" required>
        </div>
        <div class="form-group">
            <label for="motivo">Por qué quieres trabajar con nosotros?</label>
            <textarea rows="5" class="form-control" id="motivo" name="motivo" required></textarea>
        </div>
        <div class="form-group">
            <button type="button" class="btn btn-secondary" id="crear_carta">Crear Carta</button>
            <button type="submit"class="btn btn-primary">Enviar</button>
        </div>
    </form>

    <textarea id="carta" class="form-control" rows="10" readonly></textarea>
    <br>
    <br>
    <a class="volver" href="../main">Volver atrás</a>
</div>
{% endblock %}
{% block js %}
{% endblock %}
