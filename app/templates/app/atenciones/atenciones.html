{% extends "app/base/base.html" %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'app/css/atenciones/styles.css' %}">
{% endblock %}
{% block contenido %}
<div class="bloque">
  <div class="atenciones">
    <header>
    <h1>Generar Atención</h1>
    </header>
    <div class="formulario-atenciones">
      <form action="../main">
      <div class="row">
        <div class="col-25">
          <label>Nombre de Mecánico <input type="text" placeholder="Rodrigo Quesada" required></label>
        </div>
      </div>
      <div class="row">
        <div class="col-25">
          <label>Nombre Cliente <input type="text" placeholder="Mariana Alonsa" required></label>
        </div>
      </div>
      <div class="row">
        <div class="col-25">
          <label>Correo Electronico <input type="text" placeholder="ej: pedrito@gmail.com"></label>
        </div>
      </div>
      <div class="row">
        <div class="col-25">
          <label >Fecha <input type="date" required></label>
        </div>
      </div>
      <div class="row">
        <div class="col-25">
          <label>Categoría
            <select>
              <option value="Seleccione">Seleccione</option>
              <option value="Mantención">Mantencion</option>
              <option value="Cambio de Pieza">Cambio de Pieza</option>
              <option value="Limpieza">Limpieza</option>
            </select>
          </label>
        </div>
      </div>
      <div class="row">
        <div class="col-25">
          <label>Descripción
        </div>
        <div class="col-75">
          <textarea name="" class="form-control" cols="30" rows="10"></textarea>
          </label>
        </div>
        <div class="row">
          <div class="col-25">
            <label>Trabajo realizado</label>
          </div>
          <div class="col-75">
            <input type="file">
          </div>
        </div>
        <div>
          <a href="../main"><button class="button-tabla-atenciones" id="black"> Volver </button></a>
          <button type="reset" class="button-tabla-atenciones" id="red"> Borrar </button>
          <button class="button-tabla-atenciones"id="green"> Enviar </button>
        </div>
      </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
