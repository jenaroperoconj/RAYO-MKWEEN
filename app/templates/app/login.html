<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app/css/login/styles.css' %}">
</head>

<body>
<div class="container">
    <img src="{% static 'app/images/rayo_logo.png' %}" alt="Rayo Logo">
</div>
<form class="session">
    <h1>Inicio sesión</h1>
    <div class="form_input">
        <label> Nombre usuario:
            <input type="text" placeholder="Ingrese Nombre" minlength="3" required >
        </label>
    </div>
    <div class="form_input">
        <label> Correo electrónico:
            <input type="email" placeholder="Ingrese Correo Electrónico" minlength="5" required>
        </label>
    </div>
    <div class="form_input">
        <label> Contraseña:
            <input type="password"placeholder="***********" minlength="7" required>
        </label>
    </div>
    <div class="form_button">
        <input type="submit" value="Login" formaction="/main"/>
    </div>
</form>
<div>
    <footer class="pie_pagina">
        <div>
            Leer <a href="#">Política de Privacidad</a>
            <br>
            &copy; 2024 Inicio de Sesión, Taller Mecánico Rayo Mkween
        </div>
    </footer>
</div>
</body>
</html>
